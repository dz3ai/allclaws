name: Agent Platform Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周日 UTC 00:00 运行完整测试
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================
  # 静态分析测试
  # ============================================
  static-analysis:
    name: Static Analysis (11 Platforms)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        platform:
          - openclaw
          - clawteam
          - goclaw
          - ironclaw
          - maxclaw
          - nanoclaw
          - nanobot
          - zeroclaw
          - hiclaw
          - claw-ai-lab
          - hermes-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Test ${{ matrix.platform }}
        run: |
          cd test_framework
          bash scripts/run_tests.sh --platform ${{ matrix.platform }} 2>&1 | tee test_output.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}
          path: test_framework/results/
          retention-days: 30

  # ============================================
  # 基准测试
  # ============================================
  benchmarks:
    name: Benchmarks (11 Platforms)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: static-analysis
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run benchmarks
        run: |
          cd test_framework
          python3 -m benchmark.cli runtime --runs 5 2>&1 | tee benchmark_output.log

      - name: Generate job summary
        if: always()
        run: |
          cd test_framework
          LATEST=$(ls -td benchmark_results/*/runtime/ 2>/dev/null | head -1)

          echo "## Benchmark Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$LATEST" ]; then
            echo "_No benchmark results found._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          SUMMARY_FILE="${LATEST}summary.md"
          if [ -f "$SUMMARY_FILE" ]; then
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Summary not available._" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details>" >> "$GITHUB_STEP_SUMMARY"
          echo "<summary>Full Report</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat "${LATEST}runtime_benchmark_results.md" 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "_No report._"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: test_framework/benchmark_results/*/runtime/
          if-no-files-found: warn
          retention-days: 30

  # ============================================
  # 沙盒化测试 (可选)
  # ============================================
  sandboxed-tests:
    name: Sandboxed Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: benchmarks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Start sandbox environments
        run: |
          cd test_framework
          docker-compose up -d
          docker-compose ps

      - name: Verify sandbox health
        run: |
          cd test_framework
          echo "Checking container health..."
          RUNNING=$(docker-compose ps | grep "Up" | wc -l)
          TOTAL=$(docker-compose ps --services 2>/dev/null | wc -l)
          echo "$RUNNING/$TOTAL services running"
          if [ "$RUNNING" -ne "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
            echo "ERROR: Not all containers healthy"
            docker-compose ps
            exit 1
          fi
          echo "All sandbox services are healthy."

      - name: Cleanup
        if: always()
        run: |
          cd test_framework
          docker-compose down

  # ============================================
  # 生成综合报告
  # ============================================
  report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: [static-analysis, benchmarks]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all test result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test_framework/results/
          merge-multiple: true

      - name: Download benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: test_framework/benchmark_results/
          merge-multiple: true

      - name: Generate test report
        if: always()
        run: |
          cd test_framework

          echo "# AllClaws 测试报告" > test_report.md
          echo "" >> test_report.md
          echo "**生成时间:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> test_report.md
          echo "" >> test_report.md

          # Aggregate all test result JSONs
          echo "## 测试结果摘要" >> test_report.md
          echo "" >> test_report.md

          TOTAL=0; PASSED=0; FAILED=0; SKIPPED=0
          FOUND=0
          for f in results/*/results.json; do
            [ -f "$f" ] || continue
            FOUND=1
            t=$(jq -r '.total // 0' "$f" 2>/dev/null || echo 0)
            p=$(jq -r '.passed // 0' "$f" 2>/dev/null || echo 0)
            fa=$(jq -r '.failed // 0' "$f" 2>/dev/null || echo 0)
            s=$(jq -r '.skipped // 0' "$f" 2>/dev/null || echo 0)
            TOTAL=$((TOTAL + t)); PASSED=$((PASSED + p))
            FAILED=$((FAILED + fa)); SKIPPED=$((SKIPPED + s))
          done

          if [ "$FOUND" -eq 1 ]; then
            echo "| Status | Count |" >> test_report.md
            echo "|--------|-------|" >> test_report.md
            echo "| PASS   | $PASSED |" >> test_report.md
            echo "| FAIL   | $FAILED |" >> test_report.md
            echo "| SKIP   | $SKIPPED |" >> test_report.md
            echo "| **Total** | **$TOTAL** |" >> test_report.md
          else
            echo "_No test result artifacts available._" >> test_report.md
          fi
          echo "" >> test_report.md

          # Find and include benchmark summary
          echo "## 基准测试摘要" >> test_report.md
          echo "" >> test_report.md
          BENCH_SUMMARY=$(find benchmark_results/ -name "summary.md" 2>/dev/null | sort | tail -1)
          if [ -n "$BENCH_SUMMARY" ] && [ -f "$BENCH_SUMMARY" ]; then
            cat "$BENCH_SUMMARY" >> test_report.md
          else
            echo "_No benchmark summary available._" >> test_report.md
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test_framework/test_report.md
          if-no-files-found: warn
          retention-days: 90

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('test_framework/test_report.md', 'utf8');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.name,
              issue_number: context.issue.number,
              body: report.slice(0, 65000) + '\n\n...(truncated)'
            });
